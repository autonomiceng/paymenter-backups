name: test-and-build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --require-hashes -r requirements-s3.lock
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: python -m compileall -q src tools
      - run: python tools/build_release.py --output dist/first.zip
      - run: python tools/build_release.py --output dist/second.zip
      - run: cmp dist/first.zip dist/second.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.python == '3.10'
        with:
          name: native-extension
          path: dist/first.zip
  native:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, pdo_mysql, mbstring, zip, dom
          tools: composer:v2
          coverage: none
      - run: sudo apt-get update && sudo apt-get install -y mariadb-server mariadb-client acl
      - run: |
          set -euo pipefail
          while IFS= read -r -d '' source; do
            php -l "$source"
          done < <(find extension tests/integration -name '*.php' -print0)
      - run: python tools/build_release.py --output dist/Backups-0.4.3.zip
      - run: python tools/native_integration.py --release dist/Backups-0.4.3.zip --composer "$(command -v composer)"
