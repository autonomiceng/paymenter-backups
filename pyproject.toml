[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "paymenter-backups"
version = "0.4.1"
description = "Independent, recoverable backups for upstream Paymenter"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Autonomic Engineering"}]
dependencies = []

[project.scripts]
paymenter-backups = "paymenter_backups.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
